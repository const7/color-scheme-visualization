<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Visualize and explore color schemes for scientific charts and graphs">
    <meta name="keywords" content="color schemes, data visualization, scientific charts">
    <title>Color Scheme Visualization</title>

    <!-- Modern CSS frameworks -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap">
    <link rel="stylesheet" href="css/custom.css">
</head>
<body class="bg-light">
    <div class="container py-4">
        <header class="text-center mb-5">
            <h1 class="display-4 fw-bold text-primary mb-2">Color Scheme Visualization</h1>
            <p class="lead text-secondary">Explore and visualize color schemes for scientific charts</p>
        </header>

        <!-- Toggle Section -->
        <div class="toggle-container">
            <input type="radio" id="predefinedSchemeOption" name="schemeMode" checked>
            <label for="predefinedSchemeOption">Presets</label>
        
            <input type="radio" id="customSchemeOption" name="schemeMode">
            <label for="customSchemeOption">Custom</label>
        </div>

        <!-- Card 1: Input Controls -->
        <div class="content-card">
            <!-- Predefined Schemes Content -->
            <div id="predefinedContent">
                <div class="content-card-title">Select Color Scheme</div>
                <div class="row g-4">
                    <div class="col-md-6">
                        <label for="colorCountSelect" class="form-label fw-medium">Step 1: Select color count</label>
                        <select id="colorCountSelect" class="form-select"></select>
                    </div>
                    <div class="col-md-6">
                        <label for="schemeSelect" class="form-label fw-medium">Step 2: Select color scheme</label>
                        <select id="schemeSelect" class="form-select"></select>
                    </div>
                </div>
            </div>
            
            <!-- Custom Input Content -->
            <div id="customInputContent">
                <div class="content-card-title">Custom Color Input</div>
                <label for="customColors" class="form-label fw-medium mb-2">Enter your custom colors</label>
                <input type="text" id="customColors" class="form-control" placeholder="Enter comma-separated HEX codes (e.g., #F5A889,#ACD6EC)">
            </div>
        </div>
        
        <!-- Card 2: Color Swatches Section -->
        <div class="content-card">
            <div class="content-card-title">Selected Color Scheme</div>
            <div id="hexDisplay" class="text-center mb-3 text-secondary"></div>
            <div id="colorSwatches" class="color-swatches"></div>
            <div class="text-center mt-3">
                <small class="text-muted">Click on any color to copy its HEX code</small>
            </div>
        </div>

        <!-- Card 3: Charts Section -->
        <div class="content-card">
            <div class="content-card-title">Visualization Preview</div>
            
            <!-- 透明度滑块控件 -->
            <div class="opacity-slider-container mb-3">
                <label for="opacitySlider" class="form-label mb-1">Color opacity (alpha): <span id="opacityValue">1.0</span></label>
                <input type="range" class="form-range" id="opacitySlider" min="0" max="1" step="0.05" value="1">
            </div>
            
            <div class="chart-grid">
                <div class="chart-item">
                    <div id="barChart" class="chart-container"></div>
                </div>
                <div class="chart-item">
                    <div id="boxChart" class="chart-container"></div>
                </div>
                <div class="chart-item">
                    <div id="scatterChart" class="chart-container"></div>
                </div>
                <div class="chart-item">
                    <div id="lineChart" class="chart-container"></div>
                </div>
            </div>
        </div>
    </div>

    <footer class="text-center py-4 mt-4 text-muted">
        <small>Color scheme data from <a href="https://github.com/lcpmgh/colors/blob/main/%40colors.txt" class="text-decoration-none">lcpmgh/colors</a></small>
    </footer>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js" charset="utf-8"></script>
    <script src="js/plots.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
